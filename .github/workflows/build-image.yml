name: FunASR WebSocket CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================================
  # Job 1: 在 amd64 / arm64 runner 上分别编译二进制
  # ==========================================================
  build-binary:
    name: Build binary (${{ matrix.target_arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: amd64
            runner: ubuntu-24.04
            onnx_dir: onnxruntime-amd64
            onnx_url: https://github.com/microsoft/onnxruntime/releases/download/v1.14.0/onnxruntime-linux-x64-1.14.0.tgz
            ffmpeg_dir: ffmpeg-amd64
          - target_arch: arm64
            runner: ubuntu-24.04-arm
            onnx_dir: onnxruntime-arm64
            onnx_url: https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-linux-aarch64-1.17.1.tgz
            ffmpeg_dir: ffmpeg-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git wget perl ca-certificates \
            libopenblas-dev libasound2t64

      - name: Prepare ONNX Runtime
        run: |
          mkdir -p "src/websocket/docker/${{ matrix.onnx_dir }}"
          wget -q "${{ matrix.onnx_url }}"
          tar -xzf "$(basename ${{ matrix.onnx_url }})" \
            --strip-components=1 \
            -C "src/websocket/docker/${{ matrix.onnx_dir }}"
          ls "src/websocket/docker/${{ matrix.onnx_dir }}/lib" | head -5

      - name: Prepare FFmpeg (skip - install via apt)
        run: |
          cd src/websocket/docker
          mkdir -p "${{ matrix.ffmpeg_dir }}"/{bin,lib,include}
          # FFmpeg: 由 Dockerfile 在容器内自动安装（用系统包）
          # 这里只是占位目录，Dockerfile 用 apt-get install ffmpeg 等替代
          echo "FFmpeg will be installed by Dockerfile at runtime"

      - name: Configure CMake
        env:
          # Use absolute paths to avoid CMAKE_CURRENT_SOURCE_DIR vs cwd mismatch.
          # CMakeLists.txt lives in src/websocket, so a relative path passed via
          # -D would be resolved against CMAKE_CURRENT_SOURCE_DIR (= src/websocket),
          # not the cwd, which would yield a doubled "src/websocket/..." path.
          ONNX_DIR: ${{ github.workspace }}/src/websocket/docker/${{ matrix.onnx_dir }}
        run: >
          cmake -S src/websocket
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_PORTAUDIO=OFF
          -DONNXRUNTIME_DIR=${ONNX_DIR}
          -DFFMPEG_DIR=${{ github.workspace }}/src/websocket/docker/${{ matrix.ffmpeg_dir }}
          -DCMAKE_CXX_FLAGS="-Wno-error=missing-template-keyword -Wno-error -Wno-error=unused-but-set-variable -Wno-error=deprecated-declarations -I ${ONNX_DIR}/include"

      - name: Verify ONNX Runtime headers
        env:
          ONNX_DIR: ${{ github.workspace }}/src/websocket/docker/${{ matrix.onnx_dir }}
        run: |
          set -euo pipefail

          header="$(find "$ONNX_DIR/include" \
            -name onnxruntime_run_options_config_keys.h \
            -type f -print -quit)"

          if [ -z "$header" ]; then
            echo "Missing onnxruntime_run_options_config_keys.h"
            find "$ONNX_DIR/include" -maxdepth 5 -type f | sort | head -100
            exit 1
          fi

          echo "Found: $header"

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Stage binary
        run: |
          mkdir -p "dist-${{ matrix.target_arch }}"
          cp build/bin/funasr-wss-server-2pass "dist-${{ matrix.target_arch }}/"

      - name: Verify binary architecture
        run: |
          file "dist-${{ matrix.target_arch }}/funasr-wss-server-2pass"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: funasr-wss-${{ matrix.target_arch }}
          path: dist-${{ matrix.target_arch }}/funasr-wss-server-2pass
          if-no-files-found: error

      - name: Stage FunASR build artifacts
        # Bundle libfunasr.so and friends into a funasr-build/ directory so
        # the Dockerfile can COPY them into the image.
        run: |
          mkdir -p funasr-build
          find build -maxdepth 5 \( -name "*.so" -o -name "*.so.*" \) \
               -exec cp -P {} funasr-build/ \; 2>/dev/null || true
          echo "=== funasr-build contents ==="
          ls -la funasr-build | head -30

      - name: Upload FunASR build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: funasr-build-${{ matrix.target_arch }}
          path: funasr-build/
          if-no-files-found: warn

  # ==========================================================
  # Job 2: 用 Dockerfile 构建多架构镜像并推送 GHCR
  # ==========================================================
  build-image:
    name: Build & push image (${{ matrix.target_arch }})
    needs: build-binary
    # Each architecture builds on its native runner — no QEMU emulation.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            tag_suffix: amd64
          - target_arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag_suffix: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: funasr-wss-${{ matrix.target_arch }}
          path: dist-${{ matrix.target_arch }}

      - name: Download FunASR build artifacts
        uses: actions/download-artifact@v4
        with:
          name: funasr-build-${{ matrix.target_arch }}
          path: funasr-build

      - name: Debug downloaded artifacts
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== ls -la root ==="
          ls -la
          echo "=== ls -la dist-${{ matrix.target_arch }} ==="
          ls -la "dist-${{ matrix.target_arch }}" || true
          echo "=== ls -la funasr-build ==="
          ls -la funasr-build 2>/dev/null || echo "(missing)"
          echo "=== find all files (any depth) ==="
          find "dist-${{ matrix.target_arch }}" -mindepth 0 -maxdepth 5 || true
          find funasr-build -mindepth 0 -maxdepth 3 2>/dev/null || true

      - name: Prepare Docker build context
        # Bundle every file the Dockerfile expects into a single directory so
        # buildx doesn't have to chase symlinks or extra contexts.
        run: |
          mkdir -p docker-build-context
          # Copy the Dockerfile itself into the build context so buildx can
          # resolve the filename relative to context root.
          cp src/websocket/docker/Dockerfile docker-build-context/Dockerfile
          # The locally-built binary must exist (build-binary job uploaded it).
          BINARY="dist-${{ matrix.target_arch }}/funasr-wss-server-2pass"
          if [ ! -f "$BINARY" ]; then
            echo "::error::$BINARY not found. The build-binary job must produce this artifact."
            echo "=== full contents under dist-${{ matrix.target_arch }} ==="
            find "dist-${{ matrix.target_arch }}" -mindepth 0 -maxdepth 5 || true
            exit 1
          fi
          cp "$BINARY" docker-build-context/

          # ONNX Runtime: prefer the repo-root directory (which is either a real
          # checkout or a symlink target). Fall back to a fresh download if
          # the build-binary job's intermediate extraction isn't here.
          case "${{ matrix.target_arch }}" in
            amd64)
              ONNX_ROOT_NAME="onnxruntime-linux-x64-1.14.0"
              ONNX_URL="https://github.com/microsoft/onnxruntime/releases/download/v1.14.0/onnxruntime-linux-x64-1.14.0.tgz"
              ;;
            arm64)
              ONNX_ROOT_NAME="onnxruntime-linux-aarch64-1.17.1"
              ONNX_URL="https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-linux-aarch64-1.17.1.tgz"
              ;;
            *) echo "Unknown arch ${{ matrix.target_arch }}"; exit 1 ;;
          esac
          if [ ! -d "$ONNX_ROOT_NAME/lib" ]; then
            echo "Downloading ONNX Runtime for ${{ matrix.target_arch }}..."
            wget -q "$ONNX_URL" -O /tmp/onnxruntime.tgz
            mkdir -p "$ONNX_ROOT_NAME"
            tar -xzf /tmp/onnxruntime.tgz --strip-components=1 -C "$ONNX_ROOT_NAME"
            echo "  -> contents:" && ls "$ONNX_ROOT_NAME" | head -10
          fi
          if [ ! -f "$ONNX_ROOT_NAME/lib/libonnxruntime.so" ]; then
            echo "::error::ONNX Runtime is missing lib/libonnxruntime.so after prepare"
            find "$ONNX_ROOT_NAME" -maxdepth 2 || true
            exit 1
          fi
          # Copy with -L so any symlinks inside the source are followed and
          # the destination is a real directory tree (Dockerfile COPY cannot
          # resolve symlinks that point outside the build context).
          cp -rL "$ONNX_ROOT_NAME" "docker-build-context/onnxruntime-${{ matrix.target_arch }}"

          # FFmpeg: prefer the repo-root ffmpeg-master-* directory (which is either
          # a real checkout or a symlink target). Fall back to apt install.
          case "${{ matrix.target_arch }}" in
            amd64) FFMPEG_ROOT_NAME="ffmpeg-master-latest-linux64-gpl-shared" ;;
            arm64) FFMPEG_ROOT_NAME="ffmpeg-master-latest-linuxarm64-gpl-shared" ;;
            *) echo "Unknown arch ${{ matrix.target_arch }}"; exit 1 ;;
          esac
          if [ ! -x "$FFMPEG_ROOT_NAME/bin/ffmpeg" ]; then
            echo "Installing FFmpeg..."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
            mkdir -p "$FFMPEG_ROOT_NAME/bin" "$FFMPEG_ROOT_NAME/lib" "$FFMPEG_ROOT_NAME/include"
            cp /usr/bin/ffmpeg "$FFMPEG_ROOT_NAME/bin/"
            cp /usr/bin/ffprobe "$FFMPEG_ROOT_NAME/bin/" 2>/dev/null || true
            cp /usr/bin/ffplay "$FFMPEG_ROOT_NAME/bin/" 2>/dev/null || true
            # Copy shared libraries from the multiarch lib dir matching this runner.
            for LIBSUFFIX in x86_64-linux-gnu aarch64-linux-gnu; do
              if [ -d "/usr/lib/$LIBSUFFIX" ]; then
                cp /usr/lib/$LIBSUFFIX/libav*.so* "$FFMPEG_ROOT_NAME/lib/" 2>/dev/null || true
                cp /usr/lib/$LIBSUFFIX/libsw*.so* "$FFMPEG_ROOT_NAME/lib/" 2>/dev/null || true
                cp /usr/lib/$LIBSUFFIX/libpostproc*.so* "$FFMPEG_ROOT_NAME/lib/" 2>/dev/null || true
                cp -r /usr/include/$LIBSUFFIX/libav* \
                   "$FFMPEG_ROOT_NAME/include/" 2>/dev/null || true
                cp -r /usr/include/$LIBSUFFIX/libsw* \
                   "$FFMPEG_ROOT_NAME/include/" 2>/dev/null || true
                cp -r /usr/include/$LIBSUFFIX/libpostproc* \
                   "$FFMPEG_ROOT_NAME/include/" 2>/dev/null || true
              fi
            done
            echo "  -> ffmpeg bin:" && ls "$FFMPEG_ROOT_NAME/bin" | head -5
            echo "  -> ffmpeg lib:" && ls "$FFMPEG_ROOT_NAME/lib" 2>/dev/null | head -5
          fi
          # Make sure ffmpeg is executable. git may have stripped the
          # +x bit on files that were committed (it tracks 644 by default).
          chmod +x "$FFMPEG_ROOT_NAME/bin/ffmpeg" "$FFMPEG_ROOT_NAME/bin/ffprobe" "$FFMPEG_ROOT_NAME/bin/ffplay" 2>/dev/null || true
          if [ ! -x "$FFMPEG_ROOT_NAME/bin/ffmpeg" ]; then
            echo "::error::ffmpeg binary not found after prepare"
            exit 1
          fi
          cp -rL "$FFMPEG_ROOT_NAME" "docker-build-context/ffmpeg-${{ matrix.target_arch }}"

          # funasr-build: downloaded by an earlier step as funasr-build/.
          if [ -d funasr-build ]; then
            cp -rL funasr-build docker-build-context/funasr-build
          else
            echo "::warning::funasr-build artifact missing; server may fail to start"
            mkdir -p docker-build-context/funasr-build
          fi

          # Download OpenSSL source for in-image compilation.
          if [ ! -f docker-build-context/openssl-3.6.1.tar.gz ]; then
            wget -q https://www.openssl.org/source/openssl-3.6.1.tar.gz \
              -O docker-build-context/openssl-3.6.1.tar.gz
          fi

          echo "=== docker-build-context contents ==="
          ls -la docker-build-context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker-build-context
          file: docker-build-context/Dockerfile
          # No 'platforms' — each runner builds for its native arch
          # (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm).
          tags: |
            ghcr.io/${{ github.repository_owner }}/funasr-wss:${{ matrix.tag_suffix }}-latest
            ghcr.io/${{ github.repository_owner }}/funasr-wss:${{ github.sha }}-${{ matrix.tag_suffix }}
          push: ${{ github.event_name != 'pull_request' }}

  # ==========================================================
  # Job 3: Smoke test the freshly-built image (pull + --help)
  # ==========================================================
  test-image:
    name: Smoke test image (${{ matrix.target_arch }})
    needs: build-image
    # Same per-arch runners as build-image so the smoke test always
    # exercises a native-arch image (no QEMU).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            tag_suffix: amd64
          - target_arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag_suffix: arm64

    steps:
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and smoke-test the image
        # Verify the image we just pushed actually starts and the
        # binary prints its USAGE block. Pulls happen on the same
        # arch so the smoke test doesn't need QEMU.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/funasr-wss:${{ matrix.tag_suffix }}-latest
        run: |
          set -euo pipefail
          echo "==> Pulling $IMAGE"
          docker pull --platform linux/${{ matrix.platform }} "$IMAGE"

          echo "==> Running $IMAGE binary with --help"
          docker run --rm \
            --platform linux/${{ matrix.platform }} \
            --entrypoint /workspace/funasr-wss-server-2pass \
            "$IMAGE" \
            --help 2>&1 | tee /tmp/help.txt

          # Sanity check: the help output must mention the binary name
          # and at least one of our model flags. If the binary is broken
          # or the image is empty, fail the job.
          grep -q "funasr-wss-server-2pass" /tmp/help.txt
          grep -q "model-dir" /tmp/help.txt
          echo "==> Smoke test passed"
